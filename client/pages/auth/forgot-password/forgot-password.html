<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forgot Password</title>
  <link rel="stylesheet" href="forgot-password.css">
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="logo">
      <div class="logo-box"></div>
      <div class="logo-text">
        <h1>ReInvent.</h1>
        <p>INVENTORY MANAGEMENT</p>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <div class="container">

    <!-- BACKGROUND PANELS -->
    <div class="background panel1"></div>
    <div class="background panel2"></div>
    <div class="background panel3"></div>

    <!-- CENTER CARD -->
    <div class="card">
      <h2>Forgot your password?</h2>
      <p class="subtext">
        Don't worry, it can happen to anyone.<br>
        Let's help you reset it.
      </p>

      <label>Email address</label>
      <input type="email">

      <button>Send verification password</button>
    </div>

    <!-- RIGHT PANEL -->
    <div class="side-card">
      <div class="side-text">
        <span>Back</span>
        <span>to</span>
        <span>Sign</span>
        <span>In?</span>
      </div>
      <div class="divider"></div>
      <button>Sign In →</button>
    </div>

  </div>

</body>
</html>
