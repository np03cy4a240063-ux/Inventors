<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Verification Password</title>
  <link rel="stylesheet" href="reset-password.css">
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="logo">
      <div class="logo-box"></div>
      <div class="logo-text">
        <h1>ReInvent.</h1>
        <p>INVENTORY MANAGEMENT</p>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <div class="container">

    <!-- BACKGROUND PANELS -->
    <div class="background panel1"></div>
    <div class="background panel2"></div>
    <div class="background panel3"></div>

    <!-- CENTER CARD -->
    <div class="card">
      <h2>Verification Password</h2>
      <p class="subtext">
        This is your password for re-login. You <br>
        can change this once you login to your <br>
        account.
      </p>

      <label>New Password</label>
      <input type="password" id="passwordInput" placeholder="Enter new password">
      <button id="resetBtn">Reset Password</button>
    </div>

    <!-- RIGHT PANEL -->
    <div class="side-card">
      <div class="side-text">
        <span>Back</span>
        <span>to</span>
        <span>Sign</span>
        <span>In?</span>
      </div>
      <div class="divider"></div>
      <button id="backBtn">Sign In →</button>
    </div>

  </div>

  <script src="reset-password.js"></script>
</body>
</html>
