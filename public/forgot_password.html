<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recover Password - ReInvent</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="auth-page">
    <div class="auth-wrapper">
        <div class="auth-left">
            <div class="auth-brand">
                <div class="brand-icon"><i class="fas fa-microchip"></i></div>
                <div class="brand-text">
                    <h1>ReInvent.</h1>
                    <p>INVENTORY MANAGEMENT</p>
                </div>
            </div>
            <div class="info-card">
                <h2>Account Recovery</h2>
                <div class="vertical-line"></div>
                <p>Follow the simple steps to regain access to your inventory dashboard and keep your business running smoothly.</p>
            </div>
        </div>

        <div class="auth-right">
            <div class="auth-header">
                <h1>Recover Password</h1>
                <p>Get back into your account safely</p>
            </div>

            <!-- Step 1: Enter Email -->
            <div class="form-container login-box" id="step1">
                <div class="form-input-side">
                    <div class="form-group">
                        <label>Email address</label>
                        <input type="email" id="recoverEmail" placeholder="Enter your registered email" required>
                    </div>
                    <button class="auth-submit-btn inline-btn" id="sendOtpBtn">
                        Send OTP Code <i class="fas fa-paper-plane"></i>
                    </button>
                    <div class="login-create-account">
                        Remembered? <a href="login.html">Back to Login</a>
                    </div>
                </div>
            </div>

            <!-- Step 2: Enter OTP -->
            <div class="form-container login-box" id="step2" style="display: none;">
                <div class="form-input-side">
                    <div class="form-group">
                        <label>Enter 6-digit OTP</label>
                        <input type="text" id="otpCode" placeholder="000000" maxlength="6" required>
                        <span class="input-hint">We've sent a code to your email</span>
                    </div>
                    <button class="auth-submit-btn inline-btn" id="verifyOtpBtn">
                        Verify Code <i class="fas fa-check-circle"></i>
                    </button>
                </div>
            </div>

            <!-- Step 3: Reset Password -->
            <div class="form-container login-box" id="step3" style="display: none;">
                <div class="form-input-side">
                    <div class="form-group">
                        <label>New Password</label>
                        <div class="password-field">
                            <input type="password" id="newPassword" placeholder="Minimum 6 characters" required>
                            <i class="fas fa-eye-slash toggle-password"></i>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Confirm Password</label>
                        <div class="password-field">
                            <input type="password" id="confirmPassword" placeholder="Repeat new password" required>
                            <i class="fas fa-eye-slash toggle-password"></i>
                        </div>
                    </div>
                    <button class="auth-submit-btn inline-btn" id="resetPassBtn">
                        Reset Password <i class="fas fa-key"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="header.js"></script>
    <script>
        const API_BASE = window.location.port === '3001' ? '' : 'http://localhost:3001';
        let currentEmail = '';
        let currentOtp = '';

        const showStep = (step) => {
            document.querySelectorAll('.form-container').forEach(el => el.style.display = 'none');
            document.getElementById(`step${step}`).style.display = 'flex';
        };

        // Send OTP
        document.getElementById('sendOtpBtn').addEventListener('click', async () => {
            const email = document.getElementById('recoverEmail').value;
            if (!email) return alert('Please enter email');

            const btn = document.getElementById('sendOtpBtn');
            btn.textContent = 'Sending...';
            btn.disabled = true;

            try {
                const res = await fetch(`${API_BASE}/api/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();
                if (res.ok) {
                    currentEmail = email;
                    alert(`OTP sent to ${email}!\n\nDEMO OTP: ${data.otp || 'Check server console'}`);
                    showStep(2);
                } else {
                    alert(data.error);
                }
            } catch(err) {
                alert('Connection error. Server may be down.');
            }
            btn.innerHTML = 'Send OTP Code <i class="fas fa-paper-plane"></i>';
            btn.disabled = false;
        });

        // Verify OTP
        document.getElementById('verifyOtpBtn').addEventListener('click', async () => {
            const otp = document.getElementById('otpCode').value;
            if (!otp) return alert('Please enter the OTP');

            const btn = document.getElementById('verifyOtpBtn');
            btn.textContent = 'Verifying...';
            btn.disabled = true;

            try {
                const res = await fetch(`${API_BASE}/api/verify-otp`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: currentEmail, otp })
                });
                if (res.ok) {
                    currentOtp = otp;
                    showStep(3);
                } else {
                    alert('Invalid or expired OTP');
                }
            } catch(err) {
                alert('Connection error.');
            }
            btn.innerHTML = 'Verify Code <i class="fas fa-check-circle"></i>';
            btn.disabled = false;
        });

        // Reset Password
        document.getElementById('resetPassBtn').addEventListener('click', async () => {
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword !== confirmPassword) return alert('Passwords do not match');
            if (newPassword.length < 6) return alert('Password must be at least 6 characters');

            const btn = document.getElementById('resetPassBtn');
            btn.textContent = 'Resetting...';
            btn.disabled = true;

            try {
                const res = await fetch(`${API_BASE}/api/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: currentEmail, otp: currentOtp, newPassword })
                });
                if (res.ok) {
                    alert('Password reset successful! Please login.');
                    window.location.href = 'login.html';
                } else {
                    alert('Reset failed. Please try again.');
                }
            } catch(err) {
                alert('Connection error.');
            }
            btn.innerHTML = 'Reset Password <i class="fas fa-key"></i>';
            btn.disabled = false;
        });
    </script>
</body>
</html>
