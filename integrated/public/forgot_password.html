<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - ReInvent</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body class="forgot-page">
    <div class="forgot-top-banner">
        <div class="auth-brand">
            <div class="brand-icon"><i class="fas fa-microchip"></i></div>
            <div class="brand-text">
                <h1>ReInvent.</h1>
                <p>INVENTORY MANAGEMENT</p>
            </div>
        </div>
    </div>

    <div class="forgot-main-body">
        <div class="forgot-section left-section">
            <div class="forgot-card">
                <h2>Forgot your password?</h2>
                <p class="forgot-subtext">Don't worry, it can happen to anyone.<br>Let's help you reset it.</p>
                <form id="forgotForm">
                    <div class="form-group-forgot">
                        <label>Email address</label>
                        <input type="email" name="email">
                    </div>
                    <button type="submit" class="btn-black-wide">Send verification password</button>
                </form>
            </div>
        </div>

        <div class="forgot-section right-section">
            <div class="white-column-bg"></div>

            <div class="back-card">
                <h3>Back<br>to<br>Sign<br>In?</h3>
                <div class="vertical-line-dark"></div>
                <button type="button" class="btn-black-small" onclick="location.href='login.html'">
                    Sign In <i class="fas fa-arrow-right"></i>
                </button>
            </div>
        </div>
    </div>
    <script src="script_v3.js"></script>
</body>
