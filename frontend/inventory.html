<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory - ReInvent</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="dashboard-body">
    <div class="dashboard-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <div class="sidebar-brand-icon"><i class="fas fa-microchip"></i></div>
                <div class="sidebar-brand-text">
                    <h2>ReInvent.</h2>
                    <span>V1.0</span>
                </div>
            </div>

            <div class="sidebar-menu">
                <div class="menu-section">
                    <h4>MAIN</h4>
                    <ul>
                        <li><a href="dashboard.html"><i class="fas fa-th-large"></i> Dashboard</a></li>
                        <li class="active"><a href="inventory.html"><i class="fas fa-box"></i> Inventory</a></li>
                        <li><a href="#"><i class="fas fa-truck"></i> Logistics</a></li>
                        <li><a href="#"><i class="fas fa-chart-line"></i> Analytics</a></li>
                    </ul>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <div class="header-titles">
                    <h1>Inventory Management</h1>
                    <p>Manage your products, add, edit, remove or sell.</p>
                </div>
                <div class="header-actions">
                    <div class="search-bar">
                        <i class="fas fa-search"></i>
                        <input type="text" id="searchInput" placeholder="Search inventory...">
                    </div>
                    <button class="outline-btn" style="background: var(--sidebar-bg); color: white;" onclick="addItem()">+ Add Product</button>
                    <div class="profile-icon">
                        <i class="fas fa-user-circle"></i>
                    </div>
                </div>
            </header>

            <div class="dashboard-content">
                <div class="card full-width">
                    <div class="table-responsive">
                        <table class="inventory-table" id="mainInventoryTable">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>PRODUCT</th>
                                    <th>SKU</th>
                                    <th>CATEGORY</th>
                                    <th>STOCK</th>
                                    <th>MIN</th>
                                    <th>ACTIONS</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Generated by JS based on inventory data -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <script src="inventory.js"></script>
</body>
</html>
